[package]
name = "einst-editor"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Einst's editor: a copy of Dreist's geist-editor (see docs/PROGRESS.md for the source commit) with Einst's names, settings and resources, opening Geist v1 files"

[dependencies]
einst-formats = { path = "../einst-formats" }
geist-formats.workspace = true
geist-engine.workspace = true
geist-dsp.workspace = true
geist-gui.workspace = true
rfd = { version = "0.16", optional = true }

[features]
window = ["geist-gui/window", "dep:rfd"]

[[example]]
name = "editor"
required-features = ["window"]

[dev-dependencies]
geist-testkit = { path = "../../../geist/crates/geist-testkit" }

[lints]
workspace = true
