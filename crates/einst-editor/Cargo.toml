[package]
name = "einst-editor"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Einst's editor panels on top of dreist-gui, driving dreist-engine through commands"

[dependencies]
dreist-testkit.workspace = true
dreist-formats.workspace = true
dreist-engine.workspace = true
dreist-dsp.workspace = true
dreist-gui.workspace = true
dreist-editor-core.workspace = true
einst = { path = "../einst" }
einst-dsp = { path = "../einst-dsp" }
einst-formats = { path = "../einst-formats" }
dreist-host.workspace = true

[dev-dependencies]
# The tests keep options and settings out of the user's settings folder.
dreist-editor-core = { workspace = true, features = ["test-settings"] }

[features]
window = ["dreist-gui/window", "dreist-host/dialog"]

[[example]]
name = "editor"
required-features = ["window"]


[lints]
workspace = true
