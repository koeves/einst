# Dependency updates. Pull requests go to dev (main only gets release merges);
# no workflow runs on them (Actions run on release tags and by hand).
# No cargo updates: the third-party crate versions live in dreist-commons
# (its Dependabot bumps them) and arrive with the submodule bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
