name: Dependabot auto-merge

# Dependabot's pull requests into dev merge on their own once every required
# check passes (GitHub's auto-merge): patch and minor updates, GitHub Actions
# and submodule bumps. Major updates wait for a review.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: dependabot/fetch-metadata@v2
        id: meta
      - name: Enable auto-merge (squash)
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' ||
          steps.meta.outputs.package-ecosystem == 'github_actions' ||
          steps.meta.outputs.package-ecosystem == 'gitsubmodule'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
