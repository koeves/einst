name: CI

# Runs on pull requests into dev and main, inside the release (release.yml)
# and by hand (release-on-main.yml dispatches it on the follow-up changelog
# pull request's branch); never on plain branch pushes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (commons vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

jobs:
  macos:
    # The plugin and app link AppKit: everything checks on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build plugin and standalone
        run: scripts/build.sh

  windows:
    # The plugin and app on Windows (x64): lint, test and bundle them.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
      - name: Build plugin and standalone
        run: scripts/build-windows.sh
      - name: Bundle layout
        run: |
          test -f target/bundled/Einst.vst3/Contents/x86_64-win/Einst.vst3
          test -d target/bundled/Einst.vst3/Contents/Resources/Einst/Skin
          test -f target/bundled/Einst-CLAP/Einst.clap
          test -d target/bundled/Einst-CLAP/Resources/Factory
          test -f target/bundled/Einst-App/Einst.exe
          test -d target/bundled/Einst-App/Resources/Einst

  linux-build:
    # The plugin and app on Linux (x86_64, X11, ALSA): lint, test and
    # bundle them; the tests run under a virtual X server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libjack-jackd2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-icccm4-dev libxcb-dri2-0-dev libxcursor-dev libgl1-mesa-dev xvfb
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (standalone)
        run: cargo clippy --locked -p einst-plugin --all-targets --features standalone -- -D warnings
      - name: Test
        run: xvfb-run -a cargo test --locked --workspace --no-fail-fast
      - name: Build plugin and standalone
        run: scripts/build-linux.sh
      - name: Bundle layout
        run: |
          test -f target/bundled/Einst.vst3/Contents/x86_64-linux/Einst.so
          test -d target/bundled/Einst.vst3/Contents/Resources/Einst/Skin
          test -f target/bundled/Einst-CLAP/Einst.clap
          test -d target/bundled/Einst-CLAP/Resources/Factory
          test -x target/bundled/Einst-App/Einst
          test -d target/bundled/Einst-App/Resources/Einst
