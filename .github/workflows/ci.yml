name: CI

# Runs on pull requests into dev and main, as part of the tag-triggered release
# (release.yml) and by hand; never on plain branch pushes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (commons vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

jobs:
  macos:
    # The plugin and app link AppKit: everything checks on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build plugin and standalone
        run: scripts/build.sh
