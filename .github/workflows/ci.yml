name: CI

# Runs only as part of the tag-triggered release (release.yml) and by hand.
on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (commons vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

jobs:
  macos:
    # The plugin and app link AppKit: everything checks on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build plugin and standalone
        run: scripts/build.sh
