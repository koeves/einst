name: Release

# Pushing a tag `vX.Y.Z` tests and builds Einst (VST3, CLAP, standalone) on
# macOS and publishes the GitHub release with the zips. A manual run builds
# the checked-out ref and publishes to `tag` only when `upload` is set.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (names the zips; the upload target)"
        required: true
        default: "v0.1.0"
      upload:
        description: "Upload the zips to the release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'dev' }}

jobs:
  commits:
    uses: ./.github/workflows/commits.yml

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: |
          scripts/build.sh
          cd target/bundled
          ditto -c -k --keepParent Einst.vst3 "Einst-$TAG-macOS-VST3.zip"
          ditto -c -k --keepParent Einst.clap "Einst-$TAG-macOS-CLAP.zip"
          ditto -c -k --keepParent Einst.app "Einst-$TAG-macOS-App.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Einst-${{ env.TAG }}-macOS
          path: target/bundled/Einst-*.zip
          retention-days: 7

  release:
    # The tag's CHANGELOG.md section is the release notes; without one,
    # git-cliff generates them from the commits since the previous tag.
    needs: [commits, build]
    if: github.event_name == 'push' || inputs.upload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from the commits
        if: steps.notes.outputs.found != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "${{ github.event.repository.name }} $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.zip --clobber
