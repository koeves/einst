name: Release on main

# Merging the release pull request (dev -> main) releases: the version comes
# from the commits since the last tag (.github/release/next-version.sh; a
# `Release-As: X.Y.Z` line in the pull request's body or a commit message
# overrides it), the merge commit is tagged `vX.Y.Z`, release.yml publishes
# it, and a follow-up pull request brings the changelog and the version into
# dev. Nothing is released when no commit since the tag is releasable, and
# the run fails before tagging when commons is not a dreist-commons release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: The merged pull request's body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > "$RUNNER_TEMP/pr-body.txt"
      - name: Next version
        id: next
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
        run: .github/release/next-version.sh
      - name: commons is a dreist-commons release
        if: steps.next.outputs.tag != ''
        run: .github/release/check-commons.sh
      - name: Tag the merge commit
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$REPO $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      upload: true
    permissions:
      contents: write

  changelog:
    # A pull request into dev with the changelog and the version. Pull
    # requests opened with GITHUB_TOKEN start no pull_request workflows, so
    # the checks run by workflow_dispatch on its branch (their check runs land
    # on its head commit and count as its required checks); auto-merge (merge
    # commit) merges it once they pass. Its branch starts at the tagged merge
    # commit, so dev then contains the tag.
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch the checks
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      BRANCH: release/changelog-${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Changelog and version
        run: |
          git switch -c "$BRANCH"
          .github/release/changelog.sh "$TAG"
          .github/release/stamp-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(release): changelog and version for $TAG"
          git push origin "$BRANCH"
      - name: Pull request into dev
        run: |
          url=$(gh pr create --base dev --head "$BRANCH" \
            --title "docs(release): changelog and version for $TAG" \
            --body "CHANGELOG.md and the workspace version for the release $TAG (opened by release-on-main.yml; merges itself once its checks pass).")
          for wf in ci.yml commits.yml codeql.yml; do
            gh workflow run "$wf" --ref "$BRANCH"
          done
          if ! gh pr merge "$url" --auto --squash; then
            echo "::warning::Auto-merge is not available: merge $url by hand once its checks pass."
          fi
