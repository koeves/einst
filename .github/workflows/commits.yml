name: Commits

# Commit subjects follow Conventional Commits (see CONTRIBUTING.md): the
# changelog and release notes are generated from them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push has no usable base: check the head only.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD -1"
          else
            range="$BASE..$HEAD"
          fi
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! printf '%s' "$subject" | grep -Eq "$re"; then
              echo "::error::$sha: \"$subject\" is not a Conventional Commit subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' $range)
          exit $bad
