name: Commits

# Commit subjects follow Conventional Commits (see CONTRIBUTING.md): the
# changelog and release notes are generated from them. Runs inside the
# tag-triggered release (release.yml) and by hand.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: |
          # The commits since the previous release tag (all of them before the first).
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null); then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! printf '%s' "$subject" | grep -Eq "$re"; then
              echo "::error::$sha: \"$subject\" is not a Conventional Commit subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' $range)
          exit $bad
