[workspace]
resolver = "2"
members = ["crates/einst-formats", "crates/einst-dsp", "crates/einst", "crates/einst-plugin", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Same lint policy as Dreist: DSP and parsers follow the decompiled original.
[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"
assign_op_pattern = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
too_many_arguments = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
manual_range_contains = "allow"

[workspace.dependencies]
# The shared crates: dreist-commons at a pinned revision. For development
# against a local checkout, see README (a [patch] in ../.cargo/config.toml).
dreist-formats = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
dreist-dsp = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
dreist-engine = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
dreist-gui = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
dreist-editor = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
dreist-testkit = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
roxmltree = "0.20"
thiserror = "2"

[profile.release]
strip = false

[profile.test]
opt-level = 2

# dreist-commons' vendored patches: baseview with a re-entrancy guard for
# modal dialogs, signalsmith-stretch with a fixed phase-randomisation seed.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }

[patch.crates-io]
signalsmith-stretch = { git = "https://github.com/koeves/dreist-commons", rev = "c468034e7da00ba3042a85e656ce18c5ca228b1f" }
