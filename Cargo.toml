[workspace]
resolver = "2"
members = ["crates/einst-formats", "crates/einst-plugin", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Same lint policy as Dreist: DSP and parsers follow the decompiled original.
[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"
assign_op_pattern = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
too_many_arguments = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
manual_range_contains = "allow"

[workspace.dependencies]
# Dreist (Geist2 port) lives next to this repo: ~/Documents/projects/geist.
geist-formats = { path = "../geist/crates/geist-formats" }
geist-engine = { path = "../geist/crates/geist-engine" }
geist-dsp = { path = "../geist/crates/geist-dsp" }
geist-gui = { path = "../geist/crates/geist-gui" }
geist-editor = { path = "../geist/crates/geist-editor" }
roxmltree = "0.20"
thiserror = "2"

[profile.release]
strip = false

[profile.test]
opt-level = 2

# Dreist's vendored patches, used by path (see ../geist/Cargo.toml): baseview
# with a re-entrancy guard for modal dialogs, signalsmith-stretch with a fixed
# phase-randomisation seed.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "../geist/vendor/baseview" }

[patch.crates-io]
signalsmith-stretch = { path = "../geist/vendor/signalsmith-stretch" }
